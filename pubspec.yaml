name: skincare_store
description: SkinCare Store - Aplikasi toko skincare dengan PAO tracker dan filter tipe kulit
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.6.0
  intl: ^0.19.0
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
